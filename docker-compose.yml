services:
  managa-server:
    build:
      context: .
      dockerfile: managa-server/Dockerfile
    ports:
      - "5100:5100"
      - "3100-4399:3100-4399"
    environment:
      - PORT=5100
      - MANAGA_ROOT_DIR=/app
      - MANAGA_DATA_DIR=/app/data
      - AUTO_START=true
    volumes:
      - managa_data:/app/data
    restart: unless-stopped

  managa-client:
    build:
      context: ./managa-client
    ports:
      - "3000:3000"
    depends_on:
      - managa-server
    restart: unless-stopped

volumes:
  managa_data:
