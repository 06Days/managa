services:
  managa-server:
    build:
      context: .
      dockerfile: managa-server/Dockerfile
    # Managed apps bind their allocated ports at runtime. Docker cannot add
    # published ports to a running container, so host networking avoids
    # publishing a large port range (and spawning one docker-proxy per port).
    network_mode: host
    environment:
      - PORT=5100
      - MANAGA_ROOT_DIR=/app
      - MANAGA_DATA_DIR=/app/data
      - AUTO_START=true
      - MANAGA_PUBLIC_HOST=${MANAGA_PUBLIC_HOST:-http://localhost}
      - MANAGA_MCP_TOKEN=${MANAGA_MCP_TOKEN:-}
    volumes:
      - managa_data:/app/data
    restart: unless-stopped

  managa-client:
    build:
      context: ./managa-client
    network_mode: host
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # The dashboard proxies /mcp to managa-server on the host network.
      - MANAGA_SERVER_URL=http://127.0.0.1:5100
    depends_on:
      - managa-server
    restart: unless-stopped

volumes:
  managa_data:
